# Copy this file to business.yaml and edit it for your business.
# All fields are validated on startup with clear error messages.

business:
  name: "Sunrise Dental"
  timezone: "America/New_York"
  greeting: "Thanks for calling Sunrise Dental! I'm the AI receptionist. How can I help you today?"
  after_hours_message: "We're closed right now. Our regular hours are on our website. Leave your name and number and we'll call you back."
  voice: "alloy"

# 24-hour times, HH:MM. Use "null" for a closed day.
hours:
  monday: {open: "09:00", close: "17:00"}
  tuesday: {open: "09:00", close: "17:00"}
  wednesday: {open: "09:00", close: "17:00"}
  thursday: {open: "09:00", close: "17:00"}
  friday: {open: "09:00", close: "15:00"}
  saturday: null
  sunday: null

faqs:
  - question: "Do you accept walk-ins?"
    answer: "We accept walk-ins when we have availability, but appointments are recommended."
  - question: "Do you take my insurance?"
    answer: "We accept most major PPO dental plans. Call the office to confirm your specific plan."
  - question: "Where are you located?"
    answer: "We're on Main Street, next to the pharmacy. Full address and directions are on our website."
  - question: "Do you treat children?"
    answer: "Yes, we see patients of all ages, including children."

departments:
  - name: "Billing"
    phone_number: "+15551234567"
  - name: "Scheduling"
    phone_number: "+15551234568"

booking:
  # If set, appointment requests are POSTed here as JSON.
  # If null, they are saved to data/bookings.jsonl instead.
  webhook_url: null

messages:
  file_path: "data/messages.jsonl"
  # If set, messages are also POSTed here as JSON.
  webhook_url: null
