# Example business.yaml for a med spa / aesthetics practice.
# Fictional business. Run it with:
#   python -m receptionist.simulate --config examples/niches/med_spa.yaml

business:
  name: "Glow Aesthetics Med Spa"
  timezone: "America/Los_Angeles"
  greeting: "Thanks for calling Glow Aesthetics! I'm the AI receptionist. How can I help you today?"
  after_hours_message: "We're closed right now. Leave your name and number and our front desk will call you back to book your consultation."
  voice: "alloy"

hours:
  monday: {open: "09:00", close: "18:00"}
  tuesday: {open: "09:00", close: "18:00"}
  wednesday: {open: "09:00", close: "18:00"}
  thursday: {open: "09:00", close: "19:00"}
  friday: {open: "09:00", close: "17:00"}
  saturday: {open: "10:00", close: "15:00"}
  sunday: null

faqs:
  - question: "Do you offer free consultations?"
    answer: "Yes, first-time consultations are complimentary. We'll go over your goals before recommending any treatment."
  - question: "Do I need to see a doctor before treatment?"
    answer: "Every new client has a consultation with our medical team before any procedure. We can't give medical advice over the phone."
  - question: "What's your cancellation policy?"
    answer: "We ask for at least 24 hours notice to cancel or reschedule so we can offer the slot to another client."
  - question: "Do you accept walk-ins?"
    answer: "We're appointment-only, but call ahead and we'll check for a same-day opening."

departments:
  - name: "Billing"
    phone_number: "+14155550142"
  - name: "Scheduling"
    phone_number: "+14155550143"

booking:
  webhook_url: null

messages:
  file_path: "data/messages.jsonl"
  webhook_url: null
